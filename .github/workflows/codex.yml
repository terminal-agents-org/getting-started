name: Codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Custom prompt for testing (optional)"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  codex:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@codex')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex'))

    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    env:
      TARGET_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review_comment' && github.event.pull_request.number || github.event_name == 'issue_comment' && github.event.issue.number || '' }}
      COMMENT_BODY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prompt || github.event.comment.body }}
      CHECKOUT_REF: ${{ github.event_name == 'pull_request_review_comment' && format('refs/pull/{0}/merge', github.event.pull_request.number) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/merge', github.event.issue.number)) || github.event.repository.default_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: drop-sudo
          sandbox: workspace-write
          prompt: |
            You are Codex operating from GitHub Actions in the repository ${{ github.repository }}.

            Event: ${{ github.event_name }}
            Target number: ${{ env.TARGET_NUMBER }}
            Actor: ${{ github.actor }}

            If this is a pull request context, inspect the changed code and relevant nearby files before replying.
            If the user asked for a review, prioritize real bugs, regressions, security issues, and missing tests.
            If the user asked for a fix or investigation, answer with concrete findings or changes grounded in the repository.

            Keep the GitHub reply concise and directly actionable.

            User request:
            ${{ env.COMMENT_BODY }}

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: github.event_name != 'workflow_dispatch' && needs.codex.outputs.final_message != ''

    steps:
      - name: Post Codex reply
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.TARGET_NUMBER),
              body: process.env.CODEX_FINAL_MESSAGE,
            });
        env:
          TARGET_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review_comment' && github.event.pull_request.number || github.event_name == 'issue_comment' && github.event.issue.number || '' }}
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
